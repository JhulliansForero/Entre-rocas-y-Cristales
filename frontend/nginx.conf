server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — redirige rutas desconocidas a index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre → cache agresivo (1 año)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;
}
